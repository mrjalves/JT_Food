name: Deploy Food

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  PROJECT: JT_Food/JT_Food.Web/JT_Food.Web.csproj
  SERVICE: jt_sistemas_food
  DOTNET: 10.0.x

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JT_Food
        uses: actions/checkout@v4
        with:
          path: JT_Food

      # JT_Food referencia projetos de JT_ApplicationLayer por caminho relativo (../../../JT_ApplicationLayer)
      # Requer uma Secret chamada GH_PAT (Personal Access Token com permissao 'repo') porque o repo é privado
      - name: Checkout JT_ApplicationLayer
        uses: actions/checkout@v4
        with:
          repository: mrjalves/JT_ApplicationLayer
          token: ${{ secrets.GH_PAT }}
          path: JT_ApplicationLayer

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET }}

      - name: Publish
        working-directory: ./JT_Food
        run: dotnet publish ${{ env.PROJECT }} -c Release -o ./publish -p:ErrorOnDuplicatePublishOutputFiles=false

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Enviar arquivos
        working-directory: ./JT_Food
        run: |
          rsync -az --delete \
            --exclude 'appsettings.Production.json' \
            --exclude '*.db' \
            --exclude 'uploads/' \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            ./publish/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/

      - name: Reiniciar e verificar
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo systemctl restart ${{ env.SERVICE }} && sleep 5 \
             && systemctl is-active ${{ env.SERVICE }} \
             && journalctl -u ${{ env.SERVICE }} -n 30 --no-pager | grep -A5 MIGRACAO || true"
