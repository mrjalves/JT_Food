name: Deploy Food

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-food
  cancel-in-progress: false

env:
  PROJECT: src/JT_Food.Web            # ajuste: caminho real do projeto web no repo
  SERVICE: jt_sistemas_food
  DEST: /var/www/jt_sistemas_food
  DOTNET: 9.0.x                       # ajuste para o TargetFramework

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET }}

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release -o ./publish
          -p:ErrorOnDuplicatePublishOutputFiles=false

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Enviar arquivos
        run: |
          rsync -az --delete \
            --exclude 'appsettings.json' \
            --exclude 'appsettings.Production.json' \
            --exclude '*.db' \
            --exclude '*.db-shm' \
            --exclude '*.db-wal' \
            --exclude 'uploads/' \
            --exclude 'files/' \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            ./publish/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEST }}/

      - name: Reiniciar e verificar
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' <<'EOF'
          set -e
          sudo systemctl restart ${{ env.SERVICE }}
          sleep 5
          if ! systemctl is-active --quiet ${{ env.SERVICE }}; then
            echo "::error::Serviço não subiu"
            journalctl -u ${{ env.SERVICE }} -n 50 --no-pager
            exit 1
          fi
          echo "Serviço ativo."
          EOF