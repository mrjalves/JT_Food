# Configuração Nginx para JT_Food (Blazor Web App)
# Coloque em: /etc/nginx/sites-available/jt_food
# Habilite com: sudo ln -s /etc/nginx/sites-available/jt_food /etc/nginx/sites-enabled/
# Teste com: sudo nginx -t
# Recarregue: sudo systemctl reload nginx

# Mapeamento para conexões WebSocket (SignalR/Blazor)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name food.jtecsistemas.com.br; # Altere para o seu domínio/subdomínio

    # Tamanho máximo de upload (ajuste se enviar imagens/arquivos grandes)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5041;
        proxy_http_version 1.1;

        # Suporte indispensável a WebSockets do Blazor
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts longos para conexões ativas do Blazor Circuit / SignalR
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
