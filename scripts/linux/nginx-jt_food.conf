# /etc/nginx/sites-available/jt_sistemas_food
# Ativar: ln -s /etc/nginx/sites-available/jt_sistemas_food /etc/nginx/sites-enabled/
# Obter SSL (Let's Encrypt): sudo certbot --nginx -d food.jtecsistemas.com.br
# Testar/aplicar: nginx -t && systemctl reload nginx

# Blazor Server (InteractiveServer) usa WebSocket/SignalR: precisa de Upgrade real
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      keep-alive;
}

server {
    listen 80;
    listen [::]:80;
    server_name food.jtecsistemas.com.br;

    # Redireciona todo o tráfego HTTP para HTTPS quando o certificado estiver configurado
    # (Descomente a linha abaixo após rodar o certbot caso o certbot não adicione automaticamente)
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    # Cabeçalhos de Segurança
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # Porta interna do JT_Food (definida em jt_sistemas_food.service)
        proxy_pass http://127.0.0.1:5041;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Conexões longas do circuito Blazor
        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
