# /etc/nginx/sites-available/jt_sistemas_food
# Ativar: ln -s /etc/nginx/sites-available/jt_sistemas_food /etc/nginx/sites-enabled/
# Testar/aplicar: nginx -t && systemctl restart nginx

# Blazor Server (InteractiveServer) usa WebSocket/SignalR: precisa de Upgrade real
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      keep-alive;
}

server {
    listen 80;

    # AJUSTE: subdominio/dominio do Food
    server_name food.jtecsistemas.com.br;

    client_max_body_size 50M;

    location / {
        # AJUSTE: porta interna do JT_Food (a API usa 5000; nao repetir portas de outros servicos)
        proxy_pass http://localhost:5041;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Conexoes longas do circuito Blazor
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
